# The whole application:   docker compose up --build
# Only the database (for local development and tests):   docker compose up -d mysql

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-duckstore}
      MYSQL_TEST_DATABASE: ${MYSQL_TEST_DATABASE:-duckstore_test}
      MYSQL_USER: ${MYSQL_USER:-duck}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-duck_local_only}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-duck}
      DB_PASSWORD: ${MYSQL_PASSWORD:-duck_local_only}
      DB_NAME: ${MYSQL_DATABASE:-duckstore}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
